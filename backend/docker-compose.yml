services:
  db:
    # PostgreSQL, matching the `pg` driver, the `$1` placeholders in every repository, and
    # `pg_advisory_lock` in the migration runner. This file was left on mysql:8.0 when the
    # backend moved to Postgres, which is why nothing could reach a database locally.
    #
    # Alpine rather than the full image: it is ~300MB smaller and behaves identically for
    # local development.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pahad_pulse}
      POSTGRES_USER: ${DB_USER:-pahad}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pahad}
      # Every timestamp the API stores and serves is UTC.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${DB_HOST_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # `-U` matters: without it pg_isready checks the OS user, which does not exist in the
      # database, and the container is reported healthy before it can actually answer.
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-pahad} -d ${DB_NAME:-pahad_pulse}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ['npm', 'run', 'db:migrate']
    environment: &api_env
      NODE_ENV: development
      APP_ENV: local
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SERVER_URL: http://localhost:3000
      # Compose values win over backend/.env, which points DB_HOST at the host loopback.
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: ${DB_USER:-pahad}
      DB_PASSWORD: ${DB_PASSWORD:-pahad}
      DB_NAME: ${DB_NAME:-pahad_pulse}
      DB_POOL_LIMIT: '20'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    # The image's default command is the compiled server, which is what production runs.
    # Locally we want hot reload instead, so the command is overridden here rather than
    # keeping a second Dockerfile that can drift from the deployed one.
    command: ['npm', 'run', 'dev']
    environment: *api_env
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
  api_node_modules:
