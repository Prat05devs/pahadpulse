services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-pahadpulse}
      MYSQL_DATABASE: ${DB_NAME:-pahad_pulse}
      MYSQL_USER: ${DB_USER:-pahad}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pahad}
    ports:
      - '${DB_HOST_PORT:-3306}:3306'
    command: ['--default-time-zone=+00:00']
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ['npm', 'run', 'db:migrate']
    environment: &api_env
      NODE_ENV: development
      APP_ENV: local
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SERVER_URL: http://localhost:3000
      # Compose values win over backend/.env, which points DB_HOST at the host loopback.
      DB_HOST: db
      DB_PORT: '3306'
      DB_USER: ${DB_USER:-pahad}
      DB_PASSWORD: ${DB_PASSWORD:-pahad}
      DB_NAME: ${DB_NAME:-pahad_pulse}
      DB_POOL_LIMIT: '20'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    # The image's default command is the compiled server, which is what production runs.
    # Locally we want hot reload instead, so the command is overridden here rather than
    # keeping a second Dockerfile that can drift from the deployed one.
    command: ['npm', 'run', 'dev']
    environment: *api_env
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
  api_node_modules:
