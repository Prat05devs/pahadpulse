# PahadPulse on Render: the API, which also runs ingestion on a timer. Singapore region.
# The Next.js web app deploys separately to Vercel from web/.
#
# The database is Supabase Postgres, not a service defined here. It is reached over the
# public internet, so DB_SSL is mandatory and every DB_* value is a dashboard secret rather
# than a `fromService` reference — Render cannot resolve a host it does not manage.
#
# Free-tier note: Supabase allows 60 direct connections in total. The API's pool of 10 is
# the only consumer here; ingestion runs inside the API and shares that pool.
#
# INGESTION. There are no cron services. Render bills each cron job separately, and the
# GitHub Actions workflow that stood in for them stopped when the account was locked for
# billing, so the API runs the connectors itself (backend/src/services/ingestion/
# scheduler.ts). On the free plan Render sleeps a service after 15 minutes without traffic,
# and a sleeping process runs nothing — so an external pinger (cron-job.org) requests
# /health every 10 minutes. project/operations.md has the setup and the weekly manual step.

services:
  # ---------------------------------------------------------------------------------------
  # The API server.
  # ---------------------------------------------------------------------------------------
  - type: web
    name: pahadpulse-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Free: 512 MB, and 750 instance hours a month per workspace — enough for exactly one
    # service awake all month (31 x 24 = 744). A second free service would run out.
    plan: free
    region: singapore # Closest Render region to Uttarakhand; keeps DB round trips short.
    # `/health`, not `/api/health` — the health route is mounted on the app root, above the
    # /api router. Verified against the running server.
    healthCheckPath: /health

    # Migrations run on every deploy, before the new instance takes traffic. They are
    # idempotent — `schema_migrations` records what has been applied, so a redeploy with no
    # new files is a no-op.
    preDeployCommand: npm run db:migrate

    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: LOG_LEVEL
        value: info

      # Must include the Vercel domain, or every browser request fails CORS. Vercel gives
      # each branch its own preview URL, so add those deliberately rather than wildcarding.
      - key: CORS_ORIGIN
        sync: false
      - key: SERVER_URL
        sync: false

      # Supabase connection. All set in the dashboard; none can be derived here.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '5432'
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # Mandatory: Supabase refuses unencrypted connections, and the pool verifies both the
      # certificate chain and the hostname.
      - key: DB_SSL
        value: 'true'
      # Required, not optional, on Supabase. The pooler presents
      # *.pooler.supabase.com <- Supabase Intermediate 2021 CA <- Supabase Root 2021 CA,
      # and that root is self-signed and absent from Node's trust store — so without this
      # every connection fails with SELF_SIGNED_CERT_IN_CHAIN. The certificate is public,
      # not a secret, and is the same value for every service here; it is `sync: false`
      # only because it is deployment-specific. Generate the single-line value with
      # `npx tsx scripts/ca-to-env.ts <cert>` after downloading it from
      # Project Settings -> Database -> SSL Configuration.
      - key: DB_SSL_CA
        sync: false
      - key: DB_POOL_LIMIT
        value: '10'

      # Runs ingestion in this process. Exactly one instance may have it on: a second would
      # repeat every job (the source-row lock stops them colliding, not duplicating).
      - key: SCHEDULER_ENABLED
        value: 'true'
