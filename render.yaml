# PahadPulse on Render: the API and the ingestion jobs. Singapore region.
# The Next.js web app deploys separately to Vercel from web/.
#
# The database is Supabase Postgres, not a service defined here. It is reached over the
# public internet, so DB_SSL is mandatory and every DB_* value is a dashboard secret rather
# than a `fromService` reference — Render cannot resolve a host it does not manage.
#
# Free-tier note: Supabase allows 60 direct connections in total. The pools below add up to
# 10 (API) + 4 x 6 (crons) = 34 at absolute peak, which fits with room to spare. Raising any
# of them without checking that sum is how a cron starts failing to connect.

services:
  # ---------------------------------------------------------------------------------------
  # The API server.
  # ---------------------------------------------------------------------------------------
  - type: web
    name: pahadpulse-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore # Closest Render region to Uttarakhand; keeps DB round trips short.
    # `/health`, not `/api/health` — the health route is mounted on the app root, above the
    # /api router. Verified against the running server.
    healthCheckPath: /health

    # Migrations run on every deploy, before the new instance takes traffic. They are
    # idempotent — `schema_migrations` records what has been applied, so a redeploy with no
    # new files is a no-op.
    preDeployCommand: npm run db:migrate

    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: LOG_LEVEL
        value: info

      # Must include the Vercel domain, or every browser request fails CORS. Vercel gives
      # each branch its own preview URL, so add those deliberately rather than wildcarding.
      - key: CORS_ORIGIN
        sync: false
      - key: SERVER_URL
        sync: false

      # Supabase connection. All set in the dashboard; none can be derived here.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '5432'
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # Mandatory: Supabase refuses unencrypted connections, and the pool verifies both the
      # certificate chain and the hostname.
      - key: DB_SSL
        value: 'true'
      - key: DB_POOL_LIMIT
        value: '10'

  # ---------------------------------------------------------------------------------------
  # Ingestion.
  #
  # This is why the API is not on Vercel. Ingestion is a CLI, a full run takes well over a
  # minute (the OSM boundary and village pass alone took ~80s), and the HTTP trigger
  # endpoints are deferred until `accounts` exists (datasets.md §8). A scheduled container
  # running the same command a developer runs is the whole mechanism.
  # ---------------------------------------------------------------------------------------

  # Alerts, every 15 minutes. SACHET publishes 3-hour nowcasts, so a slower cadence would
  # routinely show warnings that have already expired.
  - type: cron
    name: pahadpulse-ingest-alerts
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    schedule: '*/15 * * * *'
    dockerCommand: npm run ingest -- sachet-ndma
    envVars: &ingest_env
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '5432'
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: 'true'
      # A cron container is short-lived and single-purpose; it needs very few connections.
      - key: DB_POOL_LIMIT
        value: '4'

  # Weather observations and the 7-day forecast, hourly.
  #
  # Hourly because that is the cadence the source is registered at and the rate Open-Meteo
  # actually refreshes its model — polling faster would re-read numbers that have not moved
  # while spending someone else's free allowance. One request per district per run, so
  # 13 x 24 = 312 calls/day against a 10,000/day non-commercial limit.
  #
  # Separate from the alerts cron rather than folded into it: a slow weather run must never
  # delay a flood warning, and the two have genuinely different urgencies.
  - type: cron
    name: pahadpulse-ingest-weather
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    schedule: '10 * * * *' # Ten past, to stay clear of the alerts run on the hour.
    dockerCommand: npm run ingest -- open-meteo
    envVars: *ingest_env

  # Air quality, hourly. Separate from the weather cron rather than folded into it, for the
  # same reason the connectors are separate: CAMS and the weather model are different
  # upstreams, and one going quiet must not drag the other's freshness down with it.
  - type: cron
    name: pahadpulse-ingest-air
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    schedule: '25 * * * *' # Offset from the weather run at :10.
    dockerCommand: npm run ingest -- open-meteo-air-quality
    envVars: *ingest_env

  # Earthquakes, hourly.
  #
  # Hourly rather than every few minutes despite `realtime` cadence: USGS revises magnitude
  # for hours after an event, so the 90-day lookback window matters far more than polling
  # frequency. A quake missed by 40 minutes is still correctly recorded on the next run.
  - type: cron
    name: pahadpulse-ingest-seismic
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    schedule: '40 * * * *'
    dockerCommand: npm run ingest -- usgs-earthquakes
    envVars: *ingest_env

  # GDACS disaster events, every 30 minutes.
  #
  # Slower than the SACHET alerts cron: GDACS scores events over hours and days rather than
  # issuing 3-hour nowcasts, so a 15-minute poll would re-read an unchanged assessment.
  - type: cron
    name: pahadpulse-ingest-gdacs
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    schedule: '20,50 * * * *'
    dockerCommand: npm run ingest -- gdacs
    envVars: *ingest_env

  # Observation rollup and retention, nightly.
  #
  # THIS IS WHAT KEEPS THE DATABASE INSIDE THE FREE TIER. `observations` grows at 169 rows
  # an hour — 1.48 million a year, about 249 MB — and Supabase free allows 500 MB total.
  # Without this job the database is comfortable for roughly eighteen months and then is
  # not, with no graceful way down from a hard ceiling.
  #
  # It summarises days older than 90 into `observations_daily` and prunes the raw rows, in
  # one transaction, aggregate-before-prune. Steady state is roughly 74 MB and flat.
  #
  # 02:40 UTC is 08:10 IST — after the night's hourly runs, before anyone is reading.
  - type: cron
    name: pahadpulse-rollup-observations
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    schedule: '40 2 * * *'
    dockerCommand: npm run db:rollup
    envVars: *ingest_env

  # Reference geography and the highway network. Weekly: OSM boundaries and highway numbers
  # change on the timescale of government notifications, not minutes, and Overpass is a
  # volunteer-run service that should not be polled hard.
  - type: cron
    name: pahadpulse-ingest-reference
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: singapore
    schedule: '30 20 * * 6' # Saturday 20:30 UTC = Sunday 02:00 IST.
    dockerCommand: npm run ingest -- --all
    envVars: *ingest_env
